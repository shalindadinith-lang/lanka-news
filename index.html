<!DOCTYPE html>
<html lang="si">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sri Lanka Live News</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Sinhala&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Noto Sans Sinhala', sans-serif;
      margin: 0;
      background: #f4f4f4;
      color: #222;
    }
    body.dark {
      background: #121212;
      color: #f4f4f4;
    }
    header {
      background: #b30000;
      color: #fff;
      padding: 15px;
      text-align: center;
    }
    .dark-btn {
      margin: 10px;
      padding: 6px 14px;
      border: none;
      cursor: pointer;
      border-radius: 5px;
      font-weight: bold;
    }
    main {
      padding: 15px;
    }
    .news-item {
      background: #fff;
      padding: 12px;
      margin-bottom: 10px;
      border-radius: 6px;
      box-shadow: 0 1px 5px rgba(0,0,0,0.1);
    }
    body.dark .news-item {
      background: #1e1e1e;
    }
    .news-item h3 {
      margin: 0 0 5px 0;
      font-size: 18px;
    }
    a {
      color: inherit;
      text-decoration: none;
    }
  </style>
</head>
<body>

<header>
  <h1>නවතම පුවත්</h1>
  <button class="dark-btn" onclick="toggleDarkMode()">🌙 Dark Mode</button>
</header>

<main>
  <section id="news-container">පුවත් ලෝඩ් වෙමින්...</section>
</main>

<script>
/* Dark Mode Toggle */
function toggleDarkMode() {
  document.body.classList.toggle('dark');
  localStorage.setItem(
    'darkMode',
    document.body.classList.contains('dark') ? 'enabled' : 'disabled'
  );
}

/* Load Sinhala RSS Feed */
function loadSinhalaNews() {
  const container = document.getElementById('news-container');
  container.innerHTML = 'පුවත් ලෝඩ් වෙමින්...';

  // RSS Feeds
 const feeds = [
  'https://api.rss2json.com/v1/api.json?rss_url=https://www.lankadeepa.lk/rss',
  'https://api.rss2json.com/v1/api.json?rss_url=https://sinhala.adaderana.lk/rss'
];

feeds.forEach(feedUrl => {
  fetch(feedUrl)
    .then(res => res.json())
    .then(data => {
      const container = document.getElementById('news-container');
      const items = data.items;
      items.forEach(el => {
        const title = el.title;
        const link = el.link;
        const description = el.description || '';
        const div = document.createElement('div');
        div.className = 'news-item';
        div.innerHTML = `<h3><a href="${link}" target="_blank">${title}</a></h3><p>${description}</p>`;
        container.appendChild(div);
      });
    })
    .catch(err => console.error("Failed to load RSS feed:", err));
});


/* Page Init */
document.addEventListener('DOMContentLoaded', () => {
  // Load dark mode state
  if(localStorage.getItem('darkMode') === 'enabled') {
    document.body.classList.add('dark');
  }
  // Load Sinhala news
  loadSinhalaNews();
});
</script>

</body>
</html>
