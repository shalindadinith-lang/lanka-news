<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weatherly Pro • Premium Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');
        
        body { font-family: 'Inter', sans-serif; background: #0c4a6e; height: 100vh; overflow: hidden; }

        /* Enhanced Frosted Glass - Better Contrast */
        .premium-glass {
            background: rgba(15, 23, 42, 0.65); /* Darker tint for readability */
            backdrop-filter: blur(25px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }

        .data-panel::-webkit-scrollbar { width: 4px; }
        .data-panel::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.2); border-radius: 10px; }

        #map { filter: brightness(0.9) contrast(1.1); }

        /* Animation Smoothness */
        .rain-drop { 
            position: absolute; width: 1.5px; background: linear-gradient(transparent, #bae6fd); 
            animation: fall linear infinite; pointer-events: none;
        }
        @keyframes fall { to { transform: translateY(100vh); } }

        /* Responsive adjustments */
        @media (max-width: 768px) {
            .side-panel { width: calc(100% - 2rem) !important; left: 1rem !important; height: 50vh !important; bottom: 1rem !important; top: auto !important; }
        }
    </style>
</head>
<body class="text-white">

    <div id="map" class="fixed inset-0 z-0"></div>
    <div id="anim-container" class="fixed inset-0 pointer-events-none z-[5]"></div>

    <header class="fixed top-0 left-0 right-0 z-[100] p-4 flex flex-wrap justify-between items-center gap-4">
        <div class="premium-glass px-5 py-2.5 rounded-2xl flex items-center gap-3">
            <i class="fa-solid fa-cloud-bolt text-sky-400 text-xl animate-pulse"></i>
            <span class="font-bold tracking-tighter text-lg">Weatherly</span>
        </div>

        <form id="search-form" class="flex-1 max-w-lg">
            <div class="relative group">
                <input id="search-input" type="text" placeholder="නගරයක් සොයන්න..." 
                    class="w-full premium-glass rounded-2xl px-6 py-3.5 pl-14 focus:outline-none focus:ring-2 ring-sky-400/50 transition-all placeholder:text-white/50">
                <i class="fa-solid fa-magnifying-glass absolute left-5 top-1/2 -translate-y-1/2 text-white/40 group-focus-within:text-sky-400 transition-colors"></i>
            </div>
        </form>

        <button onclick="getUserLocation()" class="premium-glass p-3.5 rounded-2xl hover:bg-white/10 active:scale-95 transition-all">
            <i class="fa-solid fa-location-crosshairs"></i>
        </button>
    </header>

    <aside id="main-card" class="side-panel fixed top-24 left-6 bottom-6 w-[400px] z-[90] premium-glass rounded-[2.5rem] flex flex-col transition-all duration-700 opacity-0 -translate-x-10">
        
        <div class="data-panel overflow-y-auto flex-1 p-8 custom-scroll">
            
            <div class="flex justify-between items-start">
                <div class="space-y-1">
                    <h2 id="ui-city" class="text-4xl font-bold tracking-tight">--</h2>
                    <p id="ui-date" class="text-sky-200/60 text-sm font-medium uppercase tracking-widest">--</p>
                </div>
                <img id="ui-icon" src="" class="w-20 h-20 drop-shadow-2xl">
            </div>

            <div class="my-6">
                <div class="flex items-baseline gap-2">
                    <span id="ui-temp" class="text-8xl font-bold tracking-tighter">--</span>
                    <span class="text-4xl text-sky-400 font-light">°C</span>
                </div>
                <p id="ui-desc" class="text-xl font-semibold capitalize text-sky-100">--</p>
                <p id="ui-feels" class="text-white/50 text-xs mt-1 italic">Feels like --°C</p>
            </div>

            <div class="bg-gradient-to-r from-sky-500/20 to-transparent border-l-4 border-sky-400 p-4 rounded-r-2xl mb-8">
                <div class="flex items-center gap-2 mb-1 text-sky-300 text-[10px] font-black uppercase">
                    <i class="fa-solid fa-sparkles"></i> AI Insight
                </div>
                <p id="ui-ai" class="text-sm leading-relaxed text-white/90">Analyzing data...</p>
            </div>

            <div class="grid grid-cols-2 gap-3 mb-8">
                <div class="bg-white/5 rounded-3xl p-4 border border-white/5">
                    <i class="fa-solid fa-droplet text-sky-400 mb-2"></i>
                    <p class="text-[10px] uppercase text-white/40 font-bold">Humidity</p>
                    <p class="text-lg font-bold"><span id="ui-hum">--</span>%</p>
                </div>
                <div class="bg-white/5 rounded-3xl p-4 border border-white/5">
                    <i class="fa-solid fa-wind text-teal-400 mb-2"></i>
                    <p class="text-[10px] uppercase text-white/40 font-bold">Wind</p>
                    <p class="text-lg font-bold"><span id="ui-wind">--</span> <small>m/s</small></p>
                </div>
                <div class="bg-white/5 rounded-3xl p-4 border border-white/5">
                    <i class="fa-solid fa-sun text-yellow-400 mb-2"></i>
                    <p class="text-[10px] uppercase text-white/40 font-bold">UV Index</p>
                    <p id="ui-uv" class="text-lg font-bold">--</p>
                </div>
                <div class="bg-white/5 rounded-3xl p-4 border border-white/5">
                    <i class="fa-solid fa-eye text-indigo-400 mb-2"></i>
                    <p class="text-[10px] uppercase text-white/40 font-bold">Visibility</p>
                    <p class="text-lg font-bold"><span id="ui-vis">--</span> km</p>
                </div>
            </div>

            <div class="space-y-6">
                <div>
                    <h3 class="text-[10px] font-black uppercase tracking-[0.2em] text-white/30 mb-4">Hourly Updates</h3>
                    <div id="ui-hourly" class="flex gap-3 overflow-x-auto pb-2 scrollbar-hide"></div>
                </div>
                <div>
                    <h3 class="text-[10px] font-black uppercase tracking-[0.2em] text-white/30 mb-4">Next 5 Days</h3>
                    <div id="ui-daily" class="space-y-2"></div>
                </div>
            </div>
        </div>
    </aside>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const KEY = 'a711d55b1e89708be65819eb07c0eeba';
        let map;

        function initMap() {
            map = L.map('map', { zoomControl: false }).setView([7.8731, 80.7718], 9);
            L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png').addTo(map);
            map.on('click', e => loadData(e.latlng.lat, e.latlng.lng));
        }

        async function loadData(lat, lon) {
            try {
                const [w, f, u] = await Promise.all([
                    fetch(`https://api.openweathermap.org/data/2.5/weather?lat=${lat}&lon=${lon}&units=metric&appid=${KEY}`).then(r => r.json()),
                    fetch(`https://api.openweathermap.org/data/2.5/forecast?lat=${lat}&lon=${lon}&units=metric&appid=${KEY}`).then(r => r.json()),
                    fetch(`https://api.openweathermap.org/data/2.5/uvi?lat=${lat}&lon=${lon}&appid=${KEY}`).then(r => r.json())
                ]);
                render(w, f, u.value);
                map.flyTo([lat, lon], 10, { duration: 1.5 });
            } catch (err) { alert("Data error!"); }
        }

        function render(w, f, uv) {
            const card = document.getElementById('main-card');
            card.style.opacity = '1';
            card.style.transform = 'translateX(0)';

            document.getElementById('ui-city').innerText = w.name;
            document.getElementById('ui-date').innerText = new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
            document.getElementById('ui-temp').innerText = Math.round(w.main.temp);
            document.getElementById('ui-desc').innerText = w.weather[0].description;
            document.getElementById('ui-feels').innerText = `Feels like ${Math.round(w.main.feels_like)}°C`;
            document.getElementById('ui-icon').src = `https://openweathermap.org/img/wn/${w.weather[0].icon}@4x.png`;
            document.getElementById('ui-hum').innerText = w.main.humidity;
            document.getElementById('ui-wind').innerText = w.wind.speed;
            document.getElementById('ui-vis').innerText = (w.visibility / 1000).toFixed(1);
            document.getElementById('ui-uv').innerText = Math.round(uv);

            // AI Insight Logic
            let aiMsg = `Currently ${w.weather[0].description} in ${w.name}. `;
            if(w.main.temp > 28) aiMsg += "Stay hydrated, it's quite warm!";
            else if(w.weather[0].main == 'Rain') aiMsg += "Don't forget your umbrella today.";
            else aiMsg += "Conditions are great for outdoor activities.";
            document.getElementById('ui-ai').innerText = aiMsg;

            // Hourly
            const hWrap = document.getElementById('ui-hourly');
            hWrap.innerHTML = '';
            f.list.slice(0, 8).forEach(h => {
                hWrap.innerHTML += `
                    <div class="min-w-[75px] bg-white/5 p-3 rounded-2xl text-center border border-white/5">
                        <p class="text-[10px] text-white/40 mb-1">${new Date(h.dt * 1000).getHours()}:00</p>
                        <img src="https://openweathermap.org/img/wn/${h.weather[0].icon}.png" class="w-8 mx-auto">
                        <p class="font-bold text-sm">${Math.round(h.main.temp)}°</p>
                    </div>`;
            });

            // Daily
            const dWrap = document.getElementById('ui-daily');
            dWrap.innerHTML = '';
            f.list.filter(i => i.dt_txt.includes("12:00:00")).forEach(d => {
                const dayName = new Date(d.dt * 1000).toLocaleDateString('en-US', { weekday: 'short' });
                dWrap.innerHTML += `
                    <div class="flex items-center justify-between bg-white/5 p-3 rounded-2xl border border-white/5">
                        <p class="font-bold text-sm w-12">${dayName}</p>
                        <div class="flex items-center gap-2">
                            <img src="https://openweathermap.org/img/wn/${d.weather[0].icon}.png" class="w-6">
                            <span class="text-[10px] text-white/40">${d.weather[0].main}</span>
                        </div>
                        <p class="font-bold text-sm">${Math.round(d.main.temp)}°C</p>
                    </div>`;
            });

            runWeatherAnim(w.weather[0].main);
        }

        function runWeatherAnim(type) {
            const container = document.getElementById('anim-container');
            container.innerHTML = '';
            if (type.includes('Rain') || type.includes('Drizzle')) {
                for (let i = 0; i < 50; i++) {
                    const drop = document.createElement('div');
                    drop.className = 'rain-drop';
                    drop.style.left = Math.random() * 100 + 'vw';
                    drop.style.animationDuration = (Math.random() * 0.5 + 0.5) + 's';
                    drop.style.opacity = Math.random();
                    container.appendChild(drop);
                }
            }
        }

        document.getElementById('search-form').onsubmit = e => {
            e.preventDefault();
            const city = document.getElementById('search-input').value;
            fetch(`https://api.openweathermap.org/geo/1.0/direct?q=${city}&limit=1&appid=${KEY}`)
                .then(r => r.json()).then(res => res.length > 0 && loadData(res[0].lat, res[0].lon));
        };

        function getUserLocation() {
            navigator.geolocation.getCurrentPosition(p => loadData(p.coords.latitude, p.coords.longitude));
        }

        window.onload = () => { initMap(); loadData(6.9271, 79.8612); };
    </script>
</body>
</html>
