<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weatherly • Premium Live Map</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@300;400;500;600&family=Inter:wght@300;400;600&display=swap');

        :root {
            --glass-bg: rgba(22, 22, 23, 0.7);
            --glass-border: rgba(255, 255, 255, 0.12);
            --accent-blue: #0071e3;
        }

        body {
            font-family: 'SF Pro Display', 'Inter', -apple-system, sans-serif;
            background-color: #000;
            color: #fff;
            -webkit-font-smoothing: antialiased;
        }

        /* Full-screen Map visibility */
        #map {
            position: fixed;
            inset: 0;
            z-index: 0;
            filter: saturate(1.2) brightness(0.8);
        }

        /* Premium Glassmorphism */
        .premium-glass {
            background: var(--glass-bg);
            backdrop-filter: blur(25px) saturate(180%);
            -webkit-backdrop-filter: blur(25px) saturate(180%);
            border: 1px solid var(--glass-border);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.8);
        }

        /* Sidebar Layout */
        .weather-sidebar {
            position: fixed;
            top: 20px;
            left: 20px;
            bottom: 20px;
            width: 400px;
            z-index: 50;
            border-radius: 28px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @media (max-width: 768px) {
            .weather-sidebar {
                width: calc(100% - 40px);
                height: 80vh;
                top: auto;
            }
        }

        /* Hide scrollbar for clean UI */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* Icon Glow */
        .condition-icon {
            filter: drop-shadow(0 0 15px rgba(0, 113, 227, 0.4));
        }

        /* Animations Containers */
        #bg { position: fixed; inset: 0; z-index: -1; }
        .layer-overlay { position: fixed; inset: 0; z-index: 10; pointer-events: none; }

        /* Typography spacing */
        .temp-main { font-size: 6rem; font-weight: 200; letter-spacing: -4px; line-height: 1; }
        .stat-card { background: rgba(255,255,255,0.05); border-radius: 18px; padding: 16px; border: 1px solid rgba(255,255,255,0.05); }

        /* Animation Keyframes (Retained from original logic) */
        @keyframes fall { to { transform: translateY(120vh); } }
        .drop { position: absolute; width: 2px; background: linear-gradient(transparent, #93c5fd); animation: fall linear infinite; }
        @keyframes snowFall { to { transform: translateY(120vh) rotate(360deg); } }
        .snowflake { position: absolute; width: 4px; height: 4px; background: white; border-radius: 50%; animation: snowFall linear infinite; }
    </style>
</head>
<body>

    <div id="bg"></div>
    <div id="map"></div>

    <div id="rain-container" class="layer-overlay hidden"></div>
    <div id="snow-container" class="layer-overlay hidden"></div>
    <div id="lightning-container" class="layer-overlay hidden"></div>
    <div id="fog-container" class="layer-overlay hidden"></div>
    <div id="clouds-container" class="layer-overlay hidden"></div>
    <div id="stars-container" class="layer-overlay hidden"></div>

    <aside id="weather-card" class="weather-sidebar premium-glass opacity-0">
        <header class="p-6 border-b border-white/10">
            <form id="search-form" class="relative group">
                <input id="search-input" type="text" 
                       placeholder="නගරයක් සොයන්න..." 
                       class="w-full bg-white/5 border border-white/10 focus:border-blue-500 transition-all rounded-2xl px-5 py-3 pl-12 text-sm placeholder:text-white/40 outline-none">
                <i class="fa-solid fa-magnifying-glass absolute left-5 top-1/2 -translate-y-1/2 text-white/40 text-sm"></i>
            </form>
            <button onclick="getUserLocation()" class="mt-4 w-full flex items-center justify-center gap-2 bg-blue-600 hover:bg-blue-500 transition-all py-3 rounded-2xl text-xs font-semibold uppercase tracking-wider">
                <i class="fa-solid fa-location-crosshairs"></i> මගේ ස්ථානය
            </button>
        </header>

        <div class="flex-1 overflow-y-auto no-scrollbar p-6">
            <section class="text-center mb-10">
                <h1 id="city-name" class="text-3xl font-semibold mb-1">Badulla, LK</h1>
                <p id="current-date" class="text-white/50 text-sm mb-6 uppercase tracking-widest">March 02, 2026</p>
                
                <div class="relative inline-block mb-4">
                    <img id="weather-icon" src="" alt="Icon" class="w-32 h-32 condition-icon mx-auto">
                    <div class="temp-main" id="temperature">--</div>
                </div>
                
                <h2 id="weather-desc" class="text-xl font-medium text-blue-400 capitalize">Condition</h2>
                <p id="feels-like" class="text-white/50 text-sm">Feels like --°C</p>
            </section>

            <div class="bg-blue-600/20 border border-blue-500/30 rounded-2xl p-5 mb-8">
                <div class="flex items-center gap-2 mb-2 text-blue-400">
                    <i class="fa-solid fa-sparkles text-xs"></i>
                    <span class="text-[10px] font-bold uppercase tracking-widest">AI Forecast</span>
                </div>
                <p id="ai-insight" class="text-sm leading-relaxed text-blue-50/90 italic"></p>
            </div>

            <div class="grid grid-cols-2 gap-4 mb-10">
                <div class="stat-card">
                    <span class="text-[10px] text-white/40 block mb-2 uppercase tracking-widest">Humidity</span>
                    <div class="flex items-center gap-3">
                        <i class="fa-solid fa-droplet text-blue-400"></i>
                        <span id="humidity-val" class="text-xl">--</span><span class="text-xs text-white/40">%</span>
                    </div>
                </div>
                <div class="stat-card">
                    <span class="text-[10px] text-white/40 block mb-2 uppercase tracking-widest">Wind Speed</span>
                    <div class="flex items-center gap-3">
                        <i class="fa-solid fa-wind text-blue-400"></i>
                        <span id="wind-val" class="text-xl">--</span><span class="text-xs text-white/40">m/s</span>
                    </div>
                </div>
                <div class="stat-card col-span-2">
                    <div class="flex justify-between items-center">
                        <div class="text-center flex-1 border-r border-white/10">
                            <span class="text-[10px] text-white/40 block mb-1 uppercase">Sunrise</span>
                            <span id="sunrise-val" class="text-lg font-medium">--:--</span>
                        </div>
                        <div class="text-center flex-1">
                            <span class="text-[10px] text-white/40 block mb-1 uppercase">Sunset</span>
                            <span id="sunset-val" class="text-lg font-medium">--:--</span>
                        </div>
                    </div>
                </div>
            </div>

            <div class="mb-10">
                <h3 class="text-xs font-bold text-white/40 uppercase tracking-widest mb-4">Hourly Forecast</h3>
                <div id="hourly-forecast" class="flex gap-4 overflow-x-auto no-scrollbar pb-2"></div>
            </div>

            <div>
                <h3 class="text-xs font-bold text-white/40 uppercase tracking-widest mb-4">5-Day Forecast</h3>
                <div id="daily-forecast" class="flex flex-col gap-3"></div>
            </div>
        </div>

        <footer class="p-4 bg-black/20 text-center">
            <p class="text-[9px] text-white/30 uppercase tracking-[2px]">OpenWeatherMap Real-time Engine</p>
        </footer>
    </aside>

    <div id="loading-overlay" class="hidden fixed inset-0 bg-black/80 z-[100] flex items-center justify-center">
        <div class="w-10 h-10 border-2 border-white/20 border-t-white rounded-full animate-spin"></div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // ... (Keep all your existing JS code here exactly as it was)
        // Ensure you use the IDs provided in the new layout above.
    </script>
</body>
</html>
