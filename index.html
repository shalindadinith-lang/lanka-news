<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weatherly Pro • Interactive Map</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap');
        
        body { font-family: 'Plus Jakarta Sans', sans-serif; height: 100vh; overflow: hidden; background: #020617; }
        
        /* Animated Gradient Background */
        #bg-canvas {
            position: fixed; inset: 0; z-index: -1;
            background: radial-gradient(circle at 50% 50%, #1e293b 0%, #020617 100%);
        }

        /* Glass Card Refined */
        .glass {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(16px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.8);
        }

        /* Scrollbar styling */
        .custom-scroll::-webkit-scrollbar { width: 4px; }
        .custom-scroll::-webkit-scrollbar-track { background: transparent; }
        .custom-scroll::-webkit-scrollbar-thumb { background: rgba(56, 189, 248, 0.3); border-radius: 10px; }

        /* Weather Animations */
        .rain-drop { position: absolute; width: 1px; background: #38bdf8; animation: fall linear infinite; }
        @keyframes fall { to { transform: translateY(100vh); } }
        
        .lightning { position: fixed; inset: 0; background: white; opacity: 0; pointer-events: none; z-index: 10; }
        .flash { animation: flash-anim 0.2s ease-out; }
        @keyframes flash-anim { 0% { opacity: 0; } 50% { opacity: 0.5; } 100% { opacity: 0; } }

        #map { filter: brightness(0.8) contrast(1.2); }
    </style>
</head>
<body class="text-slate-200">

    <div id="bg-canvas"></div>
    <div id="lightning" class="lightning"></div>
    <div id="map" class="fixed inset-0 z-0"></div>
    <div id="anim-container" class="fixed inset-0 pointer-events-none z-[5]"></div>

    <header class="fixed top-0 left-0 right-0 z-50 p-4">
        <div class="max-w-7xl mx-auto flex items-center justify-between gap-4">
            <div class="flex items-center gap-2 glass px-4 py-2 rounded-2xl">
                <i class="fa-solid fa-cloud-sun-bolt text-sky-400 text-2xl"></i>
                <span class="font-bold tracking-tight text-xl">Weatherly</span>
            </div>
            
            <div class="flex-1 max-w-md relative">
                <form id="search-form">
                    <input id="search-input" type="text" placeholder="නගරයක් සොයන්න..." 
                        class="w-full bg-slate-900/50 border border-white/10 rounded-2xl px-5 py-3 pl-12 focus:outline-none focus:ring-2 ring-sky-500/50 transition-all backdrop-blur-md">
                    <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
                </form>
            </div>

            <button onclick="getUserLocation()" class="glass p-3 rounded-2xl hover:text-sky-400 transition-colors">
                <i class="fa-solid fa-location-arrow"></i>
            </button>
        </div>
    </header>

    <aside id="weather-panel" class="fixed top-24 left-4 bottom-4 w-full max-w-[400px] z-50 glass rounded-[2.5rem] p-6 flex flex-col opacity-0 translate-x-[-20px] transition-all duration-500 overflow-hidden">
        
        <div class="custom-scroll overflow-y-auto flex-1 pr-2">
            <div class="flex justify-between items-start mb-6">
                <div>
                    <h2 id="city-name" class="text-3xl font-bold text-white">Loading...</h2>
                    <p id="date-label" class="text-slate-400 text-sm">-- --, ----</p>
                </div>
                <img id="main-icon" src="" class="w-16 h-16 drop-shadow-[0_0_15px_rgba(56,189,248,0.5)]">
            </div>

            <div class="flex items-center gap-4 mb-4">
                <span id="main-temp" class="text-7xl font-bold tracking-tighter">--</span>
                <div class="text-2xl font-light text-sky-400">°C</div>
                <div class="h-12 w-[1px] bg-white/10 mx-2"></div>
                <div>
                    <p id="weather-desc" class="text-lg font-semibold capitalize text-white">--</p>
                    <p class="text-sm text-slate-400">පැහැදිලි අහස</p>
                </div>
            </div>

            <div class="bg-sky-500/10 border border-sky-500/20 rounded-2xl p-4 mb-6">
                <div class="flex items-center gap-2 mb-1 text-sky-400 text-xs font-bold uppercase tracking-widest">
                    <i class="fa-solid fa-robot"></i> AI උපදේශය
                </div>
                <p id="ai-text" class="text-sm text-slate-300 leading-relaxed italic">දත්ත විශ්ලේෂණය කරමින්...</p>
            </div>

            <div class="grid grid-cols-2 gap-3 mb-6">
                <div class="bg-white/5 p-4 rounded-3xl border border-white/5 flex items-center gap-4">
                    <i class="fa-solid fa-droplet text-sky-400"></i>
                    <div>
                        <p class="text-[10px] text-slate-500 uppercase font-bold">Humidity</p>
                        <p class="text-sm font-bold"><span id="val-hum">--</span>%</p>
                    </div>
                </div>
                <div class="bg-white/5 p-4 rounded-3xl border border-white/5 flex items-center gap-4">
                    <i class="fa-solid fa-wind text-teal-400"></i>
                    <div>
                        <p class="text-[10px] text-slate-500 uppercase font-bold">Wind</p>
                        <p class="text-sm font-bold"><span id="val-wind">--</span> m/s</p>
                    </div>
                </div>
                <div class="bg-white/5 p-4 rounded-3xl border border-white/5 flex items-center gap-4">
                    <i class="fa-solid fa-gauge text-purple-400"></i>
                    <div>
                        <p class="text-[10px] text-slate-500 uppercase font-bold">Pressure</p>
                        <p class="text-sm font-bold"><span id="val-press">--</span> hPa</p>
                    </div>
                </div>
                <div class="bg-white/5 p-4 rounded-3xl border border-white/5 flex items-center gap-4">
                    <i class="fa-solid fa-sun text-yellow-400"></i>
                    <div>
                        <p class="text-[10px] text-slate-500 uppercase font-bold">UV Index</p>
                        <p class="text-sm font-bold" id="val-uv">--</p>
                    </div>
                </div>
                <div class="bg-white/5 p-4 rounded-3xl border border-white/5 flex items-center gap-4">
                    <i class="fa-solid fa-arrow-up-from-bracket text-orange-400"></i>
                    <div>
                        <p class="text-[10px] text-slate-500 uppercase font-bold">Sunrise</p>
                        <p class="text-sm font-bold" id="val-sunrise">--</p>
                    </div>
                </div>
                <div class="bg-white/5 p-4 rounded-3xl border border-white/5 flex items-center gap-4">
                    <i class="fa-solid fa-arrow-down-to-bracket text-rose-400"></i>
                    <div>
                        <p class="text-[10px] text-slate-500 uppercase font-bold">Sunset</p>
                        <p class="text-sm font-bold" id="val-sunset">--</p>
                    </div>
                </div>
            </div>

            <div class="mb-2">
                <p class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-4">පැය 24 පුරෝකථනය</p>
                <div id="hourly-list" class="flex gap-3 overflow-x-auto pb-4 custom-scroll"></div>
            </div>
        </div>
    </aside>

    <div id="loader" class="fixed inset-0 z-[100] bg-slate-950 flex items-center justify-center transition-opacity duration-700">
        <div class="relative">
            <div class="w-20 h-20 border-2 border-sky-500/20 border-t-sky-500 rounded-full animate-spin"></div>
            <i class="fa-solid fa-bolt absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 text-sky-500 animate-pulse"></i>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const API_KEY = 'a711d55b1e89708be65819eb07c0eeba';
        let map;

        function initMap() {
            map = L.map('map', { zoomControl: false, attributionControl: false }).setView([7.8731, 80.7718], 8);
            L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png').addTo(map);
            map.on('click', e => fetchData(e.latlng.lat, e.latlng.lng));
        }

        async function fetchData(lat, lon) {
            toggleLoader(true);
            try {
                const [weather, forecast, uv] = await Promise.all([
                    fetch(`https://api.openweathermap.org/data/2.5/weather?lat=${lat}&lon=${lon}&units=metric&appid=${API_KEY}`).then(r => r.json()),
                    fetch(`https://api.openweathermap.org/data/2.5/forecast?lat=${lat}&lon=${lon}&units=metric&appid=${API_KEY}`).then(r => r.json()),
                    fetch(`https://api.openweathermap.org/data/2.5/uvi?lat=${lat}&lon=${lon}&appid=${API_KEY}`).then(r => r.json())
                ]);
                updateUI(weather, forecast, uv.value);
                map.flyTo([lat, lon], 11, { duration: 1.5 });
            } catch (e) {
                alert("දත්ත ලබා ගැනීමේදී දෝෂයක් ඇතිවිය.");
            } finally {
                toggleLoader(false);
            }
        }

        function updateUI(w, f, uv) {
            const panel = document.getElementById('weather-panel');
            panel.style.opacity = '1';
            panel.style.transform = 'translateX(0)';

            document.getElementById('city-name').innerText = w.name;
            document.getElementById('date-label').innerText = new Date().toLocaleDateString('si-LK', { month: 'long', day: 'numeric', year: 'numeric' });
            document.getElementById('main-temp').innerText = Math.round(w.main.temp);
            document.getElementById('weather-desc').innerText = w.weather[0].description;
            document.getElementById('main-icon').src = `https://openweathermap.org/img/wn/${w.weather[0].icon}@4x.png`;
            
            // Stats
            document.getElementById('val-hum').innerText = w.main.humidity;
            document.getElementById('val-wind').innerText = w.wind.speed;
            document.getElementById('val-press').innerText = w.main.pressure;
            document.getElementById('val-uv').innerText = Math.round(uv);
            document.getElementById('val-sunrise').innerText = new Date(w.sys.sunrise * 1000).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
            document.getElementById('val-sunset').innerText = new Date(w.sys.sunset * 1000).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});

            // AI Insight
            let advice = "කාලගුණය සාමාන්‍යයි. එදිනෙදා වැඩ කටයුතු වලට බාධාවක් නැත.";
            if (w.weather[0].main === 'Rain') advice = "වැසි සහිත කාලගුණයක් පවතින බැවින් කුඩයක් භාවිතා කිරීම නුවණට හුරුයි.";
            if (w.main.temp > 32) advice = "පවතින අධික රශ්නය නිසා හොඳින් ජලය පානය කරන්න. සෙවනේ රැඳී සිටින්න.";
            document.getElementById('ai-text').innerText = advice;

            // Hourly List
            const list = document.getElementById('hourly-list');
            list.innerHTML = '';
            f.list.slice(0, 12).forEach(item => {
                const h = new Date(item.dt * 1000).getHours();
                list.innerHTML += `
                    <div class="min-w-[80px] bg-white/5 border border-white/5 rounded-2xl p-3 text-center">
                        <p class="text-[10px] text-slate-500 mb-1">${h}:00</p>
                        <img src="https://openweathermap.org/img/wn/${item.weather[0].icon}.png" class="w-10 mx-auto">
                        <p class="text-sm font-bold">${Math.round(item.main.temp)}°</p>
                    </div>
                `;
            });

            handleAnimations(w.weather[0].main);
        }

        function handleAnimations(type) {
            const container = document.getElementById('anim-container');
            const flashLayer = document.getElementById('lightning');
            container.innerHTML = '';
            
            if (type === 'Rain' || type === 'Thunderstorm') {
                for (let i = 0; i < 100; i++) {
                    const drop = document.createElement('div');
                    drop.className = 'rain-drop';
                    drop.style.left = Math.random() * 100 + 'vw';
                    drop.style.animationDuration = (Math.random() * 0.5 + 0.3) + 's';
                    drop.style.opacity = Math.random();
                    container.appendChild(drop);
                }
                if (type === 'Thunderstorm') {
                    setInterval(() => {
                        if(Math.random() > 0.8) {
                            flashLayer.classList.add('flash');
                            setTimeout(() => flashLayer.classList.remove('flash'), 200);
                        }
                    }, 3000);
                }
            }
        }

        function toggleLoader(show) {
            const loader = document.getElementById('loader');
            loader.style.opacity = show ? '1' : '0';
            setTimeout(() => loader.style.display = show ? 'flex' : 'none', 700);
        }

        async function search(city) {
            const res = await fetch(`https://api.openweathermap.org/geo/1.0/direct?q=${city}&limit=1&appid=${API_KEY}`).then(r => r.json());
            if (res.length > 0) fetchData(res[0].lat, res[0].lon);
            else alert("නගරය සොයාගත නොහැකි විය!");
        }

        document.getElementById('search-form').onsubmit = e => {
            e.preventDefault();
            search(document.getElementById('search-input').value);
        };

        function getUserLocation() {
            navigator.geolocation.getCurrentPosition(p => fetchData(p.coords.latitude, p.coords.longitude));
        }

        window.onload = () => {
            initMap();
            search('Colombo');
        };
    </script>
</body>
</html>
