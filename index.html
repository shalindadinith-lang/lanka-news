<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weatherly • Premium Interface</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap');
        
        :root {
            --glass: rgba(15, 23, 42, 0.75);
            --border: rgba(255, 255, 255, 0.12);
        }

        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background: #020617;
            color: #f1f5f9;
        }

        /* පිරිසිදු Glass Effect එකක් */
        .premium-glass {
            background: var(--glass);
            backdrop-filter: blur(20px) saturate(160%);
            border: 1px solid var(--border);
            box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.5);
        }

        /* සිතියම අඳුරු කර දත්ත පැහැදිලිව පෙන්වීම */
        #map { 
            filter: brightness(0.6) contrast(1.1) grayscale(0.2); 
            z-index: 0;
        }

        /* දත්ත කොටස් (Cards) සඳහා වන මෘදු Animation */
        .info-stat {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 1.25rem;
            border-radius: 1.5rem;
            transition: all 0.3s ease;
        }

        .info-stat:hover {
            background: rgba(255, 255, 255, 0.08);
            transform: translateY(-2px);
        }

        .custom-scroll::-webkit-scrollbar { width: 4px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #38bdf8; border-radius: 10px; }
    </style>
</head>
<body class="h-screen overflow-hidden">

    <div id="map" class="fixed inset-0"></div>

    <header class="fixed top-0 left-0 right-0 z-50 p-6">
        <div class="max-w-7xl mx-auto flex items-center justify-between">
            <div class="premium-glass px-6 py-3 rounded-2xl flex items-center gap-3">
                <div class="w-8 h-8 bg-sky-500 rounded-lg flex items-center justify-center">
                    <i class="fa-solid fa-cloud-sun text-white"></i>
                </div>
                <h1 class="text-xl font-bold tracking-tight uppercase text-sm">Weatherly <span class="text-sky-400 italic">Live</span></h1>
            </div>

            <form id="search-form" class="flex-1 max-w-md mx-6">
                <div class="relative group">
                    <input id="search-input" type="text" placeholder="නගරයක් සොයන්න..." 
                        class="w-full premium-glass rounded-2xl px-6 py-3.5 pl-14 focus:outline-none focus:ring-2 ring-sky-500/50 transition-all placeholder:text-slate-500">
                    <i class="fa-solid fa-magnifying-glass absolute left-5 top-1/2 -translate-y-1/2 text-slate-400 group-focus-within:text-sky-400"></i>
                </div>
            </form>

            <button onclick="getUserLocation()" class="premium-glass p-4 rounded-2xl hover:text-sky-400 transition-all active:scale-95">
                <i class="fa-solid fa-location-arrow"></i>
            </button>
        </div>
    </header>

    <main id="weather-card" class="fixed top-24 left-8 bottom-8 w-full max-w-[400px] z-40 premium-glass rounded-[2rem] p-8 flex flex-col gap-6 overflow-y-auto custom-scroll">
        
        <div class="text-center py-4">
            <h2 id="city-name" class="text-3xl font-bold tracking-tight mb-1">Badulla, LK</h2>
            <p id="current-date" class="text-slate-400 text-xs font-medium uppercase tracking-widest">Monday, March 2, 2026</p>
            
            <div class="flex items-center justify-center gap-4 mt-6">
                <img id="weather-icon" src="https://openweathermap.org/img/wn/02d@4x.png" class="w-24 h-24 drop-shadow-2xl">
                <div>
                    <span id="temperature" class="text-7xl font-bold tracking-tighter">27</span>
                    <span class="text-3xl font-light text-sky-400">°C</span>
                </div>
            </div>
            <p id="weather-desc" class="text-lg font-medium text-slate-300 mt-2 capitalize">Few Clouds</p>
        </div>

        <div class="bg-sky-500/10 border border-sky-500/20 rounded-3xl p-5">
            <div class="flex items-center gap-2 mb-2">
                <i class="fa-solid fa-sparkles text-sky-400 text-sm"></i>
                <span class="text-[10px] font-bold uppercase tracking-widest text-sky-400">AI Advice</span>
            </div>
            <p id="ai-insight" class="text-sm leading-relaxed text-slate-200">අද දවස එළිමහන් වැඩකටයුතු සඳහා ඉතා සුදුසුයි. උණුසුම ගැන සැලකිලිමත් වන්න.</p>
        </div>

        <div class="grid grid-cols-2 gap-3">
            <div class="info-stat">
                <i class="fa-solid fa-droplet text-sky-400 mb-2"></i>
                <p class="text-[10px] text-slate-500 uppercase font-bold">Humidity</p>
                <p class="text-xl font-semibold"><span id="humidity-val">68</span><span class="text-sm font-normal text-slate-500 ml-1">%</span></p>
            </div>
            <div class="info-stat">
                <i class="fa-solid fa-wind text-sky-400 mb-2"></i>
                <p class="text-[10px] text-slate-500 uppercase font-bold">Wind</p>
                <p class="text-xl font-semibold"><span id="wind-val">4.2</span><span class="text-sm font-normal text-slate-500 ml-1">m/s</span></p>
            </div>
            <div class="info-stat">
                <i class="fa-solid fa-sun text-yellow-400 mb-2"></i>
                <p class="text-[10px] text-slate-500 uppercase font-bold">UV Index</p>
                <p class="text-xl font-semibold" id="uv-val">Low</p>
            </div>
            <div class="info-stat">
                <i class="fa-solid fa-eye text-sky-400 mb-2"></i>
                <p class="text-[10px] text-slate-500 uppercase font-bold">Visibility</p>
                <p class="text-xl font-semibold"><span id="visibility-val">10</span><span class="text-sm font-normal text-slate-500 ml-1">km</span></p>
            </div>
        </div>

        <div class="mt-4">
            <h3 class="text-xs font-bold uppercase tracking-widest text-slate-500 mb-4">Upcoming Forecast</h3>
            <div id="hourly-forecast" class="flex gap-3 overflow-x-auto pb-2 scrollbar-hide">
                <div class="min-w-[85px] bg-white/5 border border-white/5 rounded-2xl p-3 text-center">
                    <p class="text-[10px] text-slate-400">9 PM</p>
                    <img src="https://openweathermap.org/img/wn/01n.png" class="w-8 h-8 mx-auto">
                    <p class="font-bold">24°</p>
                </div>
            </div>
        </div>

    </main>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // ඔයාගේ පරණ කේතයේ තර්කය (logic) මෙතනට එලෙසම සම්බන්ධ කරන්න.
        // UI එක update කරන විට ඉහත දී ඇති ID භාවිතා කරන්න.
    </script>
</body>
</html>
