<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weatherly • Interactive Map</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
   
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600&display=swap');
       
        :root {
            --primary: #3b82f6;
        }
       
        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: #1e3a8a; /* Deep Blue Background */
        }
       
        .title-font {
            font-family: 'Space Grotesk', sans-serif;
        }
       
        /* Animated Gradient Background - Blue Theme */
        #bg {
            background: linear-gradient(135deg, #1e3a8a, #1e40af, #3b82f6, #1d4ed8);
            background-size: 400% 400%;
            animation: gradientShift 25s ease infinite;
        }
       
        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
       
        /* Glassmorphism Card - High Visibility */
        .glass {
            background: rgba(15, 23, 42, 0.8); 
            backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 25px 50px -12px rgb(0 0 0 / 0.5);
        }
       
        /* Map Styling - Clean & Bright */
        #map {
            filter: saturate(1.2) brightness(0.9);
        }
       
        /* Rain Animation */
        @keyframes fall {
            to { transform: translateY(120vh); }
        }
        .drop {
            position: absolute;
            width: 2px;
            background: linear-gradient(transparent, #93c5fd);
            box-shadow: 0 0 8px #60a5fa;
            animation: fall linear infinite;
        }
       
        /* Snow Animation */
        @keyframes snowFall {
            to { transform: translateY(120vh) rotate(360deg); }
        }
        .snowflake {
            position: absolute;
            width: 4px;
            height: 4px;
            background: white;
            border-radius: 50%;
            box-shadow: 0 0 8px #fff;
            animation: snowFall linear infinite;
        }
       
        /* Lightning Flash */
        @keyframes lightning {
            0%, 90% { opacity: 0; }
            92% { opacity: 0.8; }
            94% { opacity: 0; }
            96% { opacity: 0.6; }
            100% { opacity: 0; }
        }
        .lightning-flash {
            position: absolute;
            inset: 0;
            background: white;
            opacity: 0;
            animation: lightning 5s infinite;
            pointer-events: none;
        }
       
        /* Fog Animation */
        @keyframes fogDrift {
            0% { transform: translateX(0); }
            100% { transform: translateX(100vw); }
        }
        .fog-layer {
            position: absolute;
            width: 200vw;
            height: 100vh;
            background: linear-gradient(transparent, rgba(255,255,255,0.2), transparent);
            filter: blur(50px);
            animation: fogDrift 60s linear infinite;
        }
       
        /* Cloud Animation */
        @keyframes drift {
            from { transform: translateX(-200%); }
            to { transform: translateX(250vw); }
        }
        .cloud {
            position: absolute;
            font-size: 140px;
            opacity: 0.5;
            filter: blur(2px);
            animation: drift linear infinite;
        }
       
        /* Stars Animation */
        @keyframes twinkle {
            0%, 100% { opacity: 0.3; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.2); }
        }
        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            box-shadow: 0 0 10px #fff;
            animation: twinkle 2s infinite alternate ease-in-out;
        }
       
        /* Fade-in Animation */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .weather-card {
            animation: fadeInUp 0.8s ease forwards;
        }
       
        /* Forecast Carousel */
        .forecast-item {
            min-width: 120px;
            flex-shrink: 0;
        }
        .scrollbar-hide::-webkit-scrollbar {
            display: none;
        }
    </style>
</head>
<body class="text-white overflow-hidden h-screen relative">
   
    <div id="bg" class="fixed inset-0 z-[-1]"></div>
   
    <div id="map" class="fixed inset-0 z-0"></div>
   
    <div id="rain-container" class="hidden fixed inset-0 z-[6] pointer-events-none"></div>
    <div id="snow-container" class="hidden fixed inset-0 z-[6] pointer-events-none"></div>
    <div id="lightning-container" class="hidden fixed inset-0 z-[6] pointer-events-none"></div>
    <div id="fog-container" class="hidden fixed inset-0 z-[6] pointer-events-none overflow-hidden"></div>
    <div id="clouds-container" class="hidden fixed inset-0 z-[6] pointer-events-none overflow-hidden"></div>
    <div id="stars-container" class="hidden fixed inset-0 z-[6] pointer-events-none"></div>
   
    <header class="fixed top-0 left-0 right-0 z-50 bg-blue-900/60 backdrop-blur-xl border-b border-white/10">
        <div class="max-w-7xl mx-auto px-6 py-5 flex items-center justify-between">
            <div class="flex items-center gap-x-3">
                <i class="fa-solid fa-cloud-sun text-4xl text-sky-300"></i>
                <div>
                    <h1 class="title-font text-3xl font-semibold tracking-tighter">Weatherly</h1>
                    <p class="text-[10px] text-sky-200 -mt-1 tracking-[2px]">LIVE MAP</p>
                </div>
            </div>
           
            <form id="search-form" class="flex-1 max-w-md mx-8">
                <div class="relative group">
                    <input id="search-input"
                           type="text"
                           placeholder="නගරයක් සොයන්න..."
                           class="w-full bg-white/10 border border-white/30 focus:border-sky-400 transition-all rounded-3xl px-6 py-4 pl-14 text-sm placeholder:text-white/60 focus:outline-none">
                    <i class="fa-solid fa-magnifying-glass absolute left-6 top-1/2 -translate-y-1/2 text-white/60 text-lg"></i>
                </div>
            </form>
           
            <button onclick="getUserLocation()"
                    class="flex items-center gap-3 bg-blue-600 hover:bg-blue-500 transition-all px-6 py-4 rounded-3xl text-sm font-medium shadow-lg">
                <i class="fa-solid fa-location-dot"></i>
                <span class="hidden md:block">මගේ ස්ථානය</span>
            </button>
        </div>
    </header>
   
    <div id="weather-card"
         class="glass fixed top-28 left-6 md:left-8 w-full max-w-[380px] rounded-3xl p-8 z-50 weather-card opacity-0 overflow-y-auto max-h-[80vh] scrollbar-hide">
       
        <div class="flex justify-between items-start mb-8">
            <div>
                <div id="city-name" class="text-3xl font-semibold title-font tracking-tight">Badulla, LK</div>
                <div id="current-date" class="text-white/60 text-sm mt-1">Today • March 02, 2026</div>
            </div>
            <img id="weather-icon" src="https://openweathermap.org/img/wn/02d@4x.png" alt="Weather Icon" class="w-24 h-24 -mt-4 transition-all">
        </div>
       
        <div class="flex items-end gap-2 mb-2">
            <div id="temperature" class="text-8xl font-light tracking-tighter leading-none">--</div>
            <div class="text-5xl text-sky-400 mb-4">°C</div>
        </div>
       
        <div id="weather-desc" class="text-xl capitalize text-white/80 mb-1 italic">Weather Condition</div>
        <div id="feels-like" class="text-white/70 text-sm">Feels like --°C</div>
       
        <div class="mt-6 p-4 bg-white/10 rounded-2xl border border-white/5">
            <h3 class="text-sm font-bold text-sky-300 mb-2 uppercase tracking-widest">AI Insight</h3>
            <p id="ai-insight" class="text-sm text-white/90 leading-relaxed"></p>
        </div>
       
        <div class="grid grid-cols-3 gap-6 mt-6">
            <div class="text-center">
                <i class="fa-solid fa-sun text-yellow-400 text-2xl mb-2"></i>
                <div class="text-[9px] tracking-widest text-white/50 uppercase">Sunrise</div>
                <div id="sunrise-val" class="text-xl font-medium mt-1">--:--</div>
            </div>
            <div class="text-center">
                <i class="fa-solid fa-moon text-blue-300 text-2xl mb-2"></i>
                <div class="text-[9px] tracking-widest text-white/50 uppercase">Sunset</div>
                <div id="sunset-val" class="text-xl font-medium mt-1">--:--</div>
            </div>
            <div class="text-center">
                <i class="fa-solid fa-eye text-sky-400 text-2xl mb-2"></i>
                <div class="text-[9px] tracking-widest text-white/50 uppercase">Visibility</div>
                <div id="visibility-val" class="text-xl font-medium mt-1">--</div>
            </div>
        </div>
       
        <div class="grid grid-cols-3 gap-6 mt-6">
            <div class="text-center">
                <i class="fa-solid fa-droplet text-sky-400 text-2xl mb-2"></i>
                <div class="text-[9px] tracking-widest text-white/50 uppercase">Humidity</div>
                <div id="humidity-val" class="text-2xl font-medium mt-1">--</div>
            </div>
            <div class="text-center">
                <i class="fa-solid fa-wind text-sky-400 text-2xl mb-2"></i>
                <div class="text-[9px] tracking-widest text-white/50 uppercase">Wind</div>
                <div id="wind-val" class="text-2xl font-medium mt-1">--</div>
            </div>
            <div class="text-center">
                <i class="fa-solid fa-gauge-high text-sky-400 text-2xl mb-2"></i>
                <div class="text-[9px] tracking-widest text-white/50 uppercase">Pressure</div>
                <div id="pressure-val" class="text-xl font-medium mt-1">--</div>
            </div>
        </div>
       
        <div class="mt-10">
            <h3 class="text-lg font-semibold mb-4 text-sky-300">Hourly Forecast</h3>
            <div id="hourly-forecast" class="flex overflow-x-auto gap-4 pb-4 scrollbar-hide"></div>
        </div>
       
        <div class="mt-10">
            <h3 class="text-lg font-semibold mb-4 text-sky-300">5-Day Forecast</h3>
            <div id="daily-forecast" class="flex overflow-x-auto gap-4 pb-4 scrollbar-hide"></div>
        </div>
       
        <div class="mt-10 text-center text-[10px] text-white/40 border-t border-white/10 pt-6">
            Click on the map or search • OpenWeatherMap API
        </div>
    </div>
   
    <div id="loading-overlay" class="hidden fixed inset-0 bg-blue-950/80 z-[999] flex items-center justify-center">
        <div class="text-center">
            <div class="w-14 h-14 border-4 border-white/20 border-t-white rounded-full animate-spin mx-auto"></div>
            <p class="mt-6 text-sm tracking-[3px] text-white/60">FETCHING DATA...</p>
        </div>
    </div>
   
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
   
    <script>
        const API_KEY = 'a711d55b1e89708be65819eb07c0eeba';
        let map;

        // Initialize Map with a cleaner tile style
        function initMap() {
            map = L.map('map', { zoomControl: false }).setView([7.8731, 80.7718], 8);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '&copy; OpenStreetMap contributors'
            }).addTo(map);
            map.on('click', (e) => fetchWeather(e.latlng.lat, e.latlng.lng));
        }

        async function fetchWeather(lat, lon, cityName = null) {
            document.getElementById('loading-overlay').classList.remove('hidden');
            try {
                let url = cityName ? 
                    `https://api.openweathermap.org/data/2.5/weather?q=${cityName}&units=metric&appid=${API_KEY}` :
                    `https://api.openweathermap.org/data/2.5/weather?lat=${lat}&lon=${lon}&units=metric&appid=${API_KEY}`;
                
                const response = await fetch(url);
                const data = await response.json();

                const forecastRes = await fetch(`https://api.openweathermap.org/data/2.5/forecast?lat=${data.coord.lat}&lon=${data.coord.lon}&units=metric&appid=${API_KEY}`);
                const forecastData = await forecastRes.json();

                updateUI(data, forecastData);
                map.flyTo([data.coord.lat, data.coord.lon], 11);
                applyAnimations(data.weather[0].main, data.weather[0].icon);
            } catch (err) {
                console.error(err);
            } finally {
                document.getElementById('loading-overlay').classList.add('hidden');
            }
        }

        function updateUI(data, forecast) {
            document.getElementById('weather-card').classList.remove('opacity-0');
            document.getElementById('city-name').innerHTML = `${data.name}, ${data.sys.country}`;
            document.getElementById('temperature').textContent = Math.round(data.main.temp);
            document.getElementById('weather-desc').textContent = data.weather[0].description;
            document.getElementById('feels-like').textContent = `Feels like ${Math.round(data.main.feels_like)}°C`;
            document.getElementById('humidity-val').textContent = data.main.humidity + "%";
            document.getElementById('wind-val').textContent = data.wind.speed + " m/s";
            document.getElementById('pressure-val').textContent = data.main.pressure + " hPa";
            document.getElementById('visibility-val').textContent = (data.visibility / 1000).toFixed(1) + " km";
            document.getElementById('weather-icon').src = `https://openweathermap.org/img/wn/${data.weather[0].icon}@4x.png`;
            
            document.getElementById('sunrise-val').textContent = new Date(data.sys.sunrise * 1000).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
            document.getElementById('sunset-val').textContent = new Date(data.sys.sunset * 1000).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});

            // AI Insight Logic
            let insight = "";
            const cond = data.weather[0].main;
            if(cond === 'Rain') insight = "වැසි සහිත කාලගුණයකි. කුඩයක් අමතක නොකරන්න.";
            else if(data.main.temp > 30) insight = "අධික උණුසුම් දිනයකි, වැඩිපුර ජලය පානය කරන්න.";
            else insight = "කාලගුණය යහපත් ය, එළිමහන් කටයුතු වලට සුදුසු දවසකි.";
            document.getElementById('ai-insight').textContent = insight;

            // Hourly
            const hourlyContainer = document.getElementById('hourly-forecast');
            hourlyContainer.innerHTML = '';
            forecast.list.slice(0, 8).forEach(item => {
                const div = document.createElement('div');
                div.className = 'forecast-item bg-white/10 rounded-2xl p-4 text-center border border-white/5';
                div.innerHTML = `
                    <div class="text-xs text-white/50">${new Date(item.dt * 1000).getHours()}:00</div>
                    <img src="https://openweathermap.org/img/wn/${item.weather[0].icon}.png" class="w-10 mx-auto">
                    <div class="text-lg font-bold">${Math.round(item.main.temp)}°</div>
                `;
                hourlyContainer.appendChild(div);
            });
        }

        function applyAnimations(main, icon) {
            const layers = ['rain-container', 'snow-container', 'lightning-container', 'fog-container', 'clouds-container', 'stars-container'];
            layers.forEach(l => document.getElementById(l).classList.add('hidden'));

            if (main === 'Rain' || main === 'Drizzle') {
                const rc = document.getElementById('rain-container');
                rc.classList.remove('hidden');
                rc.innerHTML = '';
                for(let i=0; i<80; i++) {
                    const drop = document.createElement('div');
                    drop.className = 'drop';
                    drop.style.left = Math.random() * 100 + 'vw';
                    drop.style.animationDuration = (Math.random() * 0.5 + 0.3) + 's';
                    drop.style.animationDelay = Math.random() * 2 + 's';
                    rc.appendChild(drop);
                }
            } else if (main === 'Thunderstorm') {
                document.getElementById('rain-container').classList.remove('hidden');
                document.getElementById('lightning-container').classList.remove('hidden');
                document.getElementById('lightning-container').innerHTML = '<div class="lightning-flash"></div>';
            } else if (icon.endsWith('n')) {
                document.getElementById('stars-container').classList.remove('hidden');
                const sc = document.getElementById('stars-container');
                sc.innerHTML = '';
                for(let i=0; i<50; i++) {
                    const star = document.createElement('div');
                    star.className = 'star';
                    star.style.left = Math.random() * 100 + 'vw';
                    star.style.top = Math.random() * 100 + 'vh';
                    star.style.width = star.style.height = Math.random() * 3 + 'px';
                    sc.appendChild(star);
                }
            }
        }

        document.getElementById('search-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const val = document.getElementById('search-input').value;
            if(val) fetchWeather(null, null, val);
        });

        function getUserLocation() {
            navigator.geolocation.getCurrentPosition(p => fetchWeather(p.coords.latitude, p.coords.longitude));
        }

        window.onload = initMap;
    </script>
</body>
</html>
