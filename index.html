<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SL 3D News Channel</title>

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Sinhala:wght@400;600&display=swap" rel="stylesheet">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Noto Sans Sinhala', sans-serif;
}

body{
  background:linear-gradient(135deg,#1e3c72,#2a5298,#6a11cb);
  min-height:100vh;
  color:white;
  overflow-x:hidden;
}

header{
  text-align:center;
  padding:30px;
  font-size:28px;
  font-weight:bold;
  letter-spacing:2px;
  text-shadow:0 0 15px rgba(255,255,255,0.6);
}

.section-title{
  text-align:center;
  margin:40px 0 20px;
  font-size:22px;
  background:rgba(255,255,255,0.1);
  display:inline-block;
  padding:10px 25px;
  border-radius:30px;
  backdrop-filter:blur(10px);
}

.container{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
  gap:25px;
  padding:20px 40px;
}

.news-card{
  background:rgba(255,255,255,0.1);
  backdrop-filter:blur(15px);
  padding:20px;
  border-radius:20px;
  box-shadow:0 10px 25px rgba(0,0,0,0.3);
  transition:0.5s;
  transform-style:preserve-3d;
  animation:fadeIn 1s ease forwards;
}

.news-card:hover{
  transform:rotateY(10deg) rotateX(5deg) scale(1.05);
  box-shadow:0 20px 40px rgba(0,0,0,0.5);
}

.news-card a{
  color:#fff;
  text-decoration:none;
  font-weight:600;
  font-size:16px;
}

.news-card p{
  font-size:13px;
  margin-top:8px;
  opacity:0.8;
}

@keyframes fadeIn{
  from{opacity:0;transform:translateY(30px);}
  to{opacity:1;transform:translateY(0);}
}

footer{
  text-align:center;
  padding:30px;
  opacity:0.7;
}
</style>
</head>
<body>

<header>🇱🇰 Sri Lanka 3D News Portal</header>

<center><div class="section-title">English News</div></center>

<div class="container">
<script src="//rss.bloople.net/?url=https%3A%2F%2Flankanewsweb.net%2Ffeed&showtitle=false&type=js"></script>
<script src="//rss.bloople.net/?url=https%3A%2F%2Fwww.slmirror.com%2Ffeed&showtitle=false&type=js"></script>
</div>

<center><div class="section-title">සිංහල පුවත්</div></center>

<div class="container">
<script src="//rss.bloople.net/?url=https%3A%2F%2Freadme.lk%2Ffeed&showtitle=false&type=js"></script>
<script src="//rss.bloople.net/?url=https%3A%2F%2Ftecroom.lk%2Ffeed&showtitle=false&type=js"></script>
<script src="//rss.bloople.net/?url=https%3A%2F%2Fvikalpa.org%2Ffeed&showtitle=false&type=js"></script>
</div>

<footer>
© 2026 SL 3D News Channel | Live RSS Powered
</footer>

</body>
</html>
